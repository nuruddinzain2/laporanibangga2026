<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <title>Dashboard iBangga</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      /* Cegah bounce scroll di iOS */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    /* Kunci body agar tidak bisa di-scroll */
    body {
      position: fixed;
      inset: 0;
    }

    iframe {
      /* Fallback untuk browser lama */
      height: 100vh;
      width: 100%;

      /* Modern: dynamic viewport (mengatasi address bar mobile) */
      height: 100dvh;
      width: 100dvw;

      /* Posisi fixed agar tetap full saat rotate */
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      border: none;
      display: block;

      /* Aman untuk notch/home indicator */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Saat landscape di HP, pastikan tidak ada overflow */
    @media screen and (orientation: landscape) and (max-height: 500px) {
      iframe {
        height: 100dvh;
        width: 100dvw;
      }
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbyU9eDl5NnGxiamE_GW-qo12WVaM_hd6xcIbQd3LQvuaH5wWCt7F56TZKt851ioB92HPA/exec?page=dashboard"
    allow="fullscreen; accelerometer; gyroscope; autoplay"
    allowfullscreen
    scrolling="auto">
  </iframe>

  <script>
    // Fix 100vh di iOS Safari saat rotate / address bar berubah
    function setViewportHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', function () {
      setTimeout(setViewportHeight, 200);
    });
  </script>
</body>
</html>
